<!doctype html>
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#101326" name="theme-color"/><title>Ardiden Games</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(145deg,#0e1020,#1a1430);color:#fff;min-height:100vh}button{font:inherit}.screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px}.screen.active{display:flex}.card{width:min(900px,100%);background:rgba(15,16,32,.86);border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.4);backdrop-filter:blur(10px)}.intro{text-align:center}.intro img{width:min(560px,95%);max-height:260px;object-fit:contain}h1{font-size:clamp(28px,6vw,52px);margin:12px 0 20px;letter-spacing:.04em}.primary{border:0;border-radius:16px;padding:15px 28px;background:linear-gradient(135deg,#ff4f9a,#7d56ff);color:#fff;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 10px 24px rgba(125,86,255,.3)}.primary:active,.team:active{transform:scale(.98)}.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.team{border:2px solid var(--c);background:rgba(255,255,255,.06);color:#fff;border-radius:18px;padding:18px 12px;cursor:pointer;font-weight:800}.team span{display:block;width:32px;height:32px;border-radius:50%;background:var(--c);margin:0 auto 8px;border:3px solid rgba(255,255,255,.75)}.game{width:min(1100px,100%);display:flex;flex-direction:column;gap:12px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.turn{font-weight:800;font-size:18px}.turn b{color:#7de0ff}.mini-btn{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:9px 12px;cursor:pointer}.boardwrap{position:relative;width:min(90vw,900px);margin:auto;line-height:0;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2)}.board{display:block;width:100%;height:auto}.token{position:absolute;width:24px;height:24px;border-radius:50%;border:3px solid white;box-shadow:0 3px 8px rgba(0,0,0,.55);transform:translate(-50%,-50%);transition:left .65s cubic-bezier(.2,.8,.2,1),top .65s cubic-bezier(.2,.8,.2,1);z-index:5}.token:after{content:'';position:absolute;inset:5px;border-radius:50%;background:rgba(255,255,255,.45)}.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}.dice{min-width:220px}.result{min-height:54px;text-align:center;font-weight:800;font-size:17px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08)}.modal{position:fixed;inset:0;background:rgba(4,5,15,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{width:min(500px,100%);border-radius:26px;background:#17182d;border:1px solid rgba(255,255,255,.18);padding:26px;text-align:center;box-shadow:0 30px 80px #0009}.badge{font-size:42px}.modalbox h2{font-size:30px;margin:8px 0}.modalbox p{font-size:18px;line-height:1.45}.final-badges{position:absolute;display:flex;gap:4px;flex-wrap:wrap;width:112px;z-index:8}.final-badges.top-left{top:2.5%;left:2.5%}.final-badges.top-right{top:2.5%;right:2.5%;justify-content:flex-end}.final-badges.bottom-left{bottom:2.5%;left:2.5%}.final-badges.bottom-right{bottom:2.5%;right:2.5%;justify-content:flex-end}.final-badge{width:21px;height:21px;border-radius:50%;background:rgba(20,22,40,.75);border:2px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.5)}.dice-display{display:flex;align-items:center;gap:12px;justify-content:center;margin:2px 0 0}.die-face{width:64px;height:64px;border-radius:14px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.9)}.dice-number{font-size:18px;font-weight:900}.die-face.rolling{animation:rollDie .65s ease-in-out}.final-access{position:absolute;z-index:4;pointer-events:none;border:2px dashed rgba(255,255,255,.65);border-radius:14px;box-shadow:0 0 0 3px rgba(255,79,154,.12),0 0 18px rgba(125,86,255,.25);opacity:.55}.final-access span{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:10px;font-weight:900;background:rgba(10,12,25,.82);padding:3px 6px;border-radius:999px;white-space:nowrap}@keyframes rollDie{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.08)}50%{transform:rotate(12deg) scale(.94)}75%{transform:rotate(-7deg) scale(1.06)}}.win-screen{text-align:center}.win-screen h2{font-size:34px;margin:8px 0}.final-list{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.final-list span{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.09)}.legend{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;font-size:12px;opacity:.85}.pill{padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.09)}@media(max-width:600px){.card{padding:20px;border-radius:22px}.boardwrap{width:96vw}.token{width:20px;height:20px;border-width:2px}.dice{width:100%}}
</style></head><body>

<script>
const points=[{x:.39,y:.09},{x:.46,y:.07},{x:.53,y:.08},{x:.60,y:.10},{x:.66,y:.14},{x:.72,y:.18},{x:.77,y:.24},{x:.81,y:.31},{x:.84,y:.38},{x:.87,y:.46},{x:.89,y:.54},{x:.88,y:.62},{x:.84,y:.69},{x:.80,y:.76},{x:.74,y:.82},{x:.68,y:.87},{x:.61,y:.90},{x:.54,y:.92},{x:.46,y:.91},{x:.39,y:.90},{x:.32,y:.87},{x:.26,y:.83},{x:.21,y:.77},{x:.16,y:.70},{x:.13,y:.62},{x:.11,y:.54},{x:.13,y:.45},{x:.16,y:.37},{x:.19,y:.30},{x:.24,y:.23},{x:.30,y:.18},{x:.36,y:.13}];
const categories={0:"Dibujo",2:"Mímica",4:"Tabú",6:"Pregunta",8:"Dibujo",10:"Tabú",12:"Retos",14:"Dibujo",16:"Pregunta",18:"Mímica",20:"Dibujo",22:"Tabú",24:"Retos",26:"Pregunta",28:"Dibujo",30:"Tabú"};
const finals={
  0:{name:"Mímica",icon:"🎭",entry:0},1:{name:"Mímica",icon:"🎭",entry:1},2:{name:"Mímica",icon:"🎭",entry:2},
  8:{name:"Dibujo",icon:"🎨",entry:8},9:{name:"Dibujo",icon:"🎨",entry:9},10:{name:"Dibujo",icon:"🎨",entry:10},
  16:{name:"Pregunta",icon:"❓",entry:16},17:{name:"Pregunta",icon:"❓",entry:17},18:{name:"Pregunta",icon:"❓",entry:18},
  21:{name:"Tabú",icon:"🚫",entry:21},22:{name:"Tabú",icon:"🚫",entry:22},23:{name:"Tabú",icon:"🚫",entry:23},
  25:{name:"Retos",icon:"🏔️",entry:25},26:{name:"Retos",icon:"🏔️",entry:26},27:{name:"Retos",icon:"🏔️",entry:27}
};
const starts=[31,5,13,21], colors=["#ff4f9a","#27b8f3","#22b6ee","#9a62f5"], labels=["Equipo 1","Equipo 2","Equipo 3","Equipo 4"];
const icons={"Mímica":"🎭","Dibujo":"🎨","Pregunta":"❓","Tabú":"🚫","Retos":"🏔️"};
const dieFaces=["⚀","⚁","⚂","⚃","⚄","⚅"];
let current=0,positions=[0,0,0,0],selected=[false,false,false,false],locked=false,won=[[],[],[],[]];
const $=id=>document.getElementById(id), screens=['intro','teams','game','winner'];
function show(id){screens.forEach(s=>$(s).classList.remove('active'));$(id).classList.add('active')}
$('accept').addEventListener('click',()=>show('teams'));
const grid=$('teamGrid');
labels.forEach((name,i)=>{const b=document.createElement('button');b.className='team';b.style.setProperty('--c',colors[i]);b.innerHTML='<span></span>'+name;b.addEventListener('click',()=>selectTeam(i));grid.appendChild(b)});
function selectTeam(i){current=i;positions[i]=starts[i];selected[i]=true;show('game');updateTokens();updateTurn();updateBadges();$('result').innerHTML='Empieza <b>'+labels[i]+'</b>. Pulsa <b>TIRAR DADO</b>.'}
function updateTurn(){$('turnText').innerHTML='Turno: <b>'+labels[current]+'</b>'}
function updateTokens(){for(let i=0;i<4;i++){const el=$('t'+(i+1)),p=points[positions[i]];el.style.left=(p.x*100)+'%';el.style.top=(p.y*100)+'%';el.style.background=colors[i];el.style.display=selected[i]?'block':'none'}}
function updateBadges(){for(let i=0;i<4;i++){const box=$('badges'+(i+1));box.innerHTML='';['Mímica','Dibujo','Pregunta','Tabú','Retos'].forEach(cat=>{const d=document.createElement('div');d.className='final-badge';d.title=cat;d.textContent=won[i].includes(cat)?icons[cat]:'·';d.style.opacity=won[i].includes(cat)?'1':'.55';box.appendChild(d)})}}
function categoryInfo(cat){return {'Mímica':['🎭','MÍMICA','Coged una tarjeta de Mímica.'],'Dibujo':['🎨','DIBUJO','Coged una tarjeta de Dibujo.'],'Pregunta':['❓','PREGUNTA','Coged una tarjeta de Pregunta.'],'Tabú':['🚫','TABÚ','Coged una tarjeta de Tabú.'],'Retos':['🏔️','RETOS','Coged una tarjeta de Retos.']}[cat]}
function openModal(icon,title,text,actions){$('modalIcon').textContent=icon;$('modalTitle').textContent=title;$('modalText').textContent=text;const box=$('modalActions');box.innerHTML='';actions.forEach(a=>{const b=document.createElement('button');b.className='primary';b.textContent=a.label;b.addEventListener('click',a.fn);box.appendChild(b)});$('modal').classList.add('show')}
function closeModal(){ $('modal').classList.remove('show') }
function nextTurn(){current=(current+1)%4;let guard=0;while(!selected[current]&&guard<4){current=(current+1)%4;guard++}if(selected[current]){updateTurn();$('result').innerHTML='Turno de <b>'+labels[current]+'</b>.'}}
function awardFinal(cat){closeModal();if(!won[current].includes(cat))won[current].push(cat);updateBadges();if(won[current].length===5){$('winnerTitle').textContent='🏆 ¡'+labels[current]+' ha ganado!';$('winnerText').textContent='Ha conseguido las 5 pruebas finales: '+won[current].map(c=>icons[c]+' '+c).join(' · ')+'.';show('winner');return} $('result').innerHTML='<b>'+labels[current]+'</b> ha superado la prueba final de <b>'+cat+'</b>.';nextTurn()}
function tryFinal(cat){closeModal();openModal(icons[cat],'PRUEBA FINAL: '+cat,'Realizad ahora la prueba final de '+cat+' con la tarjeta física. Cuando la superéis, pulsad «PRUEBA SUPERADA».',[{label:'PRUEBA SUPERADA',fn:()=>awardFinal(cat)},{label:'NO SUPERADA',fn:()=>{closeModal();$('result').innerHTML='<b>'+labels[current]+'</b> no ha superado la prueba final de '+cat+'.';nextTurn()}}])}
$('roll').addEventListener('click',()=>{
  if(locked)return;
  locked=true;
  const n=Math.floor(Math.random()*6)+1;
  const face=$('dieFace');
  face.classList.remove('rolling'); void face.offsetWidth; face.classList.add('rolling');
  $('diceNumber').textContent='Ha salido el número '+n;
  $('result').innerHTML='🎲 <b>'+labels[current]+'</b> ha sacado un <b>'+n+'</b>. Moviendo la ficha…';
  positions[current]=(positions[current]+n)%points.length;
  updateTokens();
  setTimeout(()=>{
    face.classList.remove('rolling');
    const final=finals[positions[current]];
    locked=false;
    if(final){
      const cat=final.name;
      if(won[current].includes(cat)){
        $('result').innerHTML='🎲 Ha salido <b>'+n+'</b>. <b>'+labels[current]+'</b> ya ha conseguido <b>'+icons[cat]+' '+cat+'</b>.';
        openModal(icons[cat],'PRUEBA FINAL YA CONSEGUIDA','Esta prueba final ya está en vuestro marcador. Podéis continuar con la siguiente.',[{label:'CONTINUAR',fn:()=>{closeModal();nextTurn()}}]);
      }else{
        $('result').innerHTML='🎲 Ha salido <b>'+n+'</b>. ¡Habéis llegado al <b>ACCESO DE '+cat.toUpperCase()+'</b>!';
        openModal(final.icon,'¡ACCESO A PRUEBA FINAL!','Habéis llegado a una casilla de acceso a la prueba final de '+cat+'. Coged la tarjeta física de '+cat+' y realizad la prueba.',[
          {label:'PRUEBA SUPERADA',fn:()=>awardFinal(cat)},
          {label:'NO SUPERADA',fn:()=>{closeModal();$('result').innerHTML='<b>'+labels[current]+'</b> no ha superado la prueba final de '+cat+'.';nextTurn()}}
        ]);
      }
    }else if(categories[positions[current]]){
      const cat=categories[positions[current]],info=categoryInfo(cat);
      $('result').innerHTML='🎲 Ha salido <b>'+n+'</b>. Casilla: <b>'+cat+'</b>.';
      openModal(info[0],info[1],info[2],[{label:'CONTINUAR',fn:()=>{closeModal();nextTurn()}}]);
    }else{
      $('result').innerHTML='🎲 Ha salido <b>'+n+'</b>. Casilla normal.';
      nextTurn();
    }
  },650);
});
$('close').addEventListener('click',()=>{closeModal();nextTurn()});
$('restart').addEventListener('click',()=>resetGame());
$('winnerRestart').addEventListener('click',()=>resetGame());
function resetGame(){positions=[0,0,0,0];selected=[false,false,false,false];won=[[],[],[],[]];current=0;locked=false;$('dieFace').textContent='⚀';$('diceNumber').textContent='Aún no has tirado';updateBadges();show('teams')}
</script></body></html>
